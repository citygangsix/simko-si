[project]
name = "simko-voice-id"
version = "0.1.0"
description = "Simko SI voice biometrics (speaker ID) + emotion prototype, CPU-only"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "soundfile", "torch", "torchaudio", "speechbrain", "praat-parselmouth",
  "funasr", "cryptography", "fastapi", "uvicorn", "python-multipart"]
[project.scripts]
simko-voice = "simko_voice_id.cli:main"
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
packages = ["simko_voice_id", "simko_voice_id.encoders"]
