name: Publish private RunPod coding image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - runpod/**
      - .github/workflows/publish-runpod-coding-image.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runpod-coding-image
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out application source
        uses: actions/checkout@v4

      - name: Check out canonical Granite agent
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: agent/canonical-granite-agent-20260816
          path: .private-build/canonical-agent-source

      - name: Stage private build context
        shell: bash
        run: |
          set -euo pipefail
          agent_source=".private-build/canonical-agent-source/preserved-projects/granite-agent"
          test -f "$agent_source/pyproject.toml"
          test -f "$agent_source/setup.py"
          test -d "$agent_source/granite_agent"
          mkdir -p runpod/canonical-agent
          cp "$agent_source/pyproject.toml" runpod/canonical-agent/
          cp "$agent_source/setup.py" runpod/canonical-agent/
          cp -R "$agent_source/granite_agent" runpod/canonical-agent/granite_agent

      - name: Log in to the private GitHub registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish private image
        uses: docker/build-push-action@v6
        with:
          context: runpod
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chatgptmentors-granite-coding-runtime:2026.08
            ghcr.io/${{ github.repository_owner }}/chatgptmentors-granite-coding-runtime:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
