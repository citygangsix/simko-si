<title>Chat</title>
<script>
(function () {
  var id = "reef-live";
  try {
    var saved = localStorage.getItem("simcoTheme");
    if (saved) id = saved;
  } catch (e) {}
  document.documentElement.setAttribute("data-theme", id);
  var link = document.createElement("link");
  link.id = "themeStylesheet";
  link.rel = "stylesheet";
  link.href = "/themes/" + encodeURIComponent(id) + "/theme.css";
  document.head.appendChild(link);
})();
</script>
<style>
  /*
    Book-style foldables.
    Galaxy Z Fold 7 cover, measured CSS viewport 412×960, landscape 960×412, DPR 2.625

    (https://breakpane.com/en/devices/galaxy-z-fold7-open). Physical 8.0 in, 2184×1968.
    YesViz also publishes a DPR 2 estimate of 984×1092 (https://yesviz.com/devices/samsung-z-fold7/);
    that size stays in the two-pane range.
    motorola razr fold (2026), Motorola's book-style fold: cover 6.6 in 2520×1080,
    main 8.1 in 2484×2232, aspect 8:7.2
    (https://en-us.support.motorola.com/app/answers/detail/a_id/193612).

<script>
const SYSTEM = "You are a senior front-end engineer. Return exactly one complete HTML5 document starting with <!DOCTYPE html> and ending with </html>. One file with inline CSS and exactly one script. No markdown fences. No commentary outside the HTML.";
const USER_OPENER = "First character of your reply must be < of <!DOCTYPE html>. Zero prose before that.";
let model = "granite4.2:8b-q8_0";

// Calculator steps. Keywords match whole words only, so "address" is not "add",
// "sometimes" is not "times", and "subtraction" still counts as subtract.
function detectIntent(text) {
  const t = text.toLowerCase();
  const has = (re) => re.test(t);
  if (has(/\b(division|divide|divided|divides|dividing)\b/)) return "div";
  if (has(/\bmulti-?digit\b/)) return "mul_multi";
  if (has(/\bdecimals?\b/)) return "decimal";
  if (has(/\b(subtract|subtracts|subtracting|subtraction|minus)\b/)) return "sub";
  if (has(/\b(add|adds|adding|addition|plus)\b/)) return "add";
  if (has(/\b(multiply|multiplies|multiplying|multiplication|times)\b/)) return "mul";
  if (has(/\b(calculator|front end|shell)\b/)) return "fe_shell";
  return "";
}

// Coding jobs: the server queues Aider with the user's words and waits for RUN.
let pendingCodingJob = null;
let codingPoll = null;

function voiceReply(text) {
  if (window.simcoVoice) window.simcoVoice.reply(text);
}

function codingDone(status) {
  return status === "done" || status === "failed" || status === "cancelled";
}

async function pollCodingJob(jobId) {
  const reply = document.getElementById("reply-bubble");
  if (codingPoll) clearTimeout(codingPoll);
  try {
    const response = await fetch("/api/coding/status/" + encodeURIComponent(jobId));
    const data = await response.json();
    if (data && data.everyday) reply.textContent = data.everyday;
    if (data && !codingDone(data.status)) {
      codingPoll = setTimeout(() => pollCodingJob(jobId), 2000);
    } else if (data) {
      const result = data.result || {};
      const failure = result.failure || null;
      const details = failure ? (failure.detail || failure.message || "") : (result.preview || "");
      if (details) {
        document.getElementById("raw-text").textContent = details;
        document.getElementById("raw").style.display = "block";
      }
      if (data.everyday) rememberReply(data.everyday);
      voiceReply(data.everyday || (failure ? "The coding job failed. Say fix it and I'll try again." : "The coding job is done."));
    }
  } catch (e) {
    codingPoll = setTimeout(() => pollCodingJob(jobId), 4000);
  }
}

async function runCodingJob(word) {
  const reply = document.getElementById("reply-bubble");
  const jobId = pendingCodingJob;
  try {
    const response = await fetch("/api/coding/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ job_id: jobId, confirm: word })
    });
    const data = await response.json();
    if (!data || data.ok === false) {
      reply.textContent = (data && data.error) || "The coding job did not start.";
      voiceReply(reply.textContent);
      return;
    }
    pendingCodingJob = null;
    reply.textContent = "Starting the coding job.";
    voiceReply(reply.textContent);
    pollCodingJob(jobId);
  } catch (e) {
    reply.textContent = "The coding job could not reach the computer.";
  }
}

function buildPayload(feature, everyday) {
  const lines = {
    fe_shell: "Rewrite into one complete HTML5 calculator front end with digits, operators, C, =, and display id display.",
    mul: "Rewrite so multiplication (*) works. Keep prior gates working.",
    mul_multi: "Rewrite so multi-digit append and multiplication work.",
    div: "Rewrite so division (/) works. Keep multiplication working.",
    add: "Rewrite so addition (+) works. Keep prior gates working.",
    sub: "Rewrite so subtraction (-) works. Keep prior gates working.",
    decimal: "Rewrite so a leading decimal (.5) becomes 0.5. Keep prior gates working."
  };
  return {
    model: model,
    think: false,
    stream: false,
    messages: [
      { role: "system", content: SYSTEM },
      { role: "user", content: USER_OPENER + "\n\n" + (lines[feature] || lines.fe_shell) + "\n" + everyday + "\nOutput ONLY the raw HTML document." }
    ],
    options: { temperature: 1.0, top_p: 0.95, num_ctx: 8192, num_predict: feature === "mul_multi" ? 8192 : 4096 }
  };
}

async function loadModel() {
  const compute = activeCompute();
  try {
    const response = await fetch("/api/compute");
    const data = await response.json();
    if (data && data.model) model = data.model;
  } catch (e) {}
  if (compute !== "local") return;
  try {
    const response = await fetch("/api/probe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ compute: "local", role: "coding" })
    });
    const data = await response.json();
    if (data && data.model) model = data.model;
  } catch (e) {}
}

async function onSend(event) {
  event.preventDefault();
  const text = document.getElementById("everyday").value.trim();
  if (!text) return;
  if (window.simcoVoice) window.simcoVoice.consumeTurn();
  await loadModel();
  const reply = document.getElementById("reply-bubble");
  const rawBox = document.getElementById("raw");
  const rawText = document.getElementById("raw-text");
  rawBox.open = false;
  rawBox.style.display = "none";
  showMyMessage(text);
  if (pendingCodingJob && text === "RUN") {
    document.getElementById("everyday").value = "";
    if (authToken && activeSessionId && String(activeSessionId).indexOf("demo-") !== 0) {
      await sessionPost({ op: "append", session_id: activeSessionId, role: "user", text: text });
    }
    await runCodingJob(text);
    return;
  }
  const feature = detectIntent(text);
  let raw = "";
  let everyday = "";
  reply.textContent = "Working on it…";
  try {
    const turn = { text: text, model: model };
    if (feature) turn.feature = feature;
    if (typeof authToken !== "undefined" && authToken) turn.token = authToken;
    const response = await fetch("/api/simco/turn", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(turn)
    });
    const data = await response.json();
    if (response.status === 409 || (data && data.install_required)) {
      showTurtle();
      reply.textContent = (data && (data.message || data.error)) || "Simko SI is still configuring this computer.";
      voiceReply(reply.textContent);
      return;
    }
    raw = (data && data.raw) || "";
    everyday = (data && data.everyday) || "";
    if (data && data.model) model = data.model;
    pendingCodingJob = (data && data.intent === "coding" && data.needs_confirm && data.job_id) ? data.job_id : null;
    if (data && data.intent === "coding" && data.job_id && data.needs_confirm === false) {
      reply.textContent = everyday || "Working on it…";
      document.getElementById("everyday").value = "";
      voiceReply(reply.textContent);
      pollCodingJob(data.job_id);
      await rememberTurn(text, reply.textContent);
      return;
    }
  } catch (e) {
    raw = "";
    everyday = "";
  }
  const everydayLine = everyday || "No reply came back from Simko SI. Try again in a moment.";
  reply.textContent = everydayLine;
  voiceReply(everydayLine);
  if (raw) {
    rawText.textContent = raw;
    rawBox.style.display = "block";
  }
  document.getElementById("everyday").value = "";
  await rememberTurn(text, everydayLine);
  await tagTurn(text);
}

document.getElementById("composer").addEventListener("submit", onSend);
document.getElementById("everyday").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    document.getElementById("composer").requestSubmit();
  }
});
let activeRole = "coding";
let chosenOffer = null;
let downloadPoll = null;

function activeCompute() {
  return document.getElementById("computeLocal").getAttribute("aria-pressed") === "true" ? "local" : "cloud";
}

function setConnected(on) {
  const mark = document.getElementById("stackMark");
  mark.textContent = on ? "●" : "○";
  mark.title = on ? "Connected" : "Not connected";
  mark.setAttribute("aria-label", mark.title);
}

function setRole(role) {
  activeRole = role;
  document.getElementById("roleCoding").setAttribute("aria-pressed", role === "coding" ? "true" : "false");
  document.getElementById("roleVideo").setAttribute("aria-pressed", role === "video" ? "true" : "false");
  document.getElementById("roleImage").setAttribute("aria-pressed", role === "image" ? "true" : "false");
  autoConnect();
}

async function autoConnect() {
  let probed = null;
  try {
    const response = await fetch("/api/probe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ compute: "local", role: activeRole })
    });
    probed = await response.json();
  } catch (e) {
    setConnected(false);
    return;
  }
  const facts = (probed && probed.probe) || {};
  const gpu = String(facts.gpu || "").toLowerCase();
  const cloudClass = Number(facts.vram_gb || 0) >= 20 || gpu.indexOf("3090") >= 0;
  if (cloudClass) {
    await setCompute("cloud");
    try {
      const response = await fetch("/api/probe", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ compute: "cloud", role: activeRole })
      });
      const cloud = await response.json();
      if (cloud && cloud.model) model = cloud.model;
      setConnected(!!(cloud && cloud.ok && !cloud.needs_rent));
    } catch (e) {
      setConnected(false);
    }
    return;
  }
  await setCompute("local");
  if (probed && probed.model) model = probed.model;
  setConnected(!!(probed && probed.ok && !probed.needs_rent && (probed.model || probed.install_script)));
}

function statusWord(data) {
  if (!data) return "Waiting";
  if (data.status_word) return data.status_word;
  if (data.status === "pass" || data.install === "pass") return "Ready";
  if (data.status === "running" || data.install === "started" || data.install === "already_running") return "Downloading";
  return "Waiting";
}

async function openRent() {
  document.getElementById("drawer").hidden = false;
  document.getElementById("toolsToggle").setAttribute("aria-expanded", "true");
  document.getElementById("rent-sheet").hidden = false;
  const line = document.getElementById("autoOffer");
  chosenOffer = null;
  try {
    const response = await fetch("/api/offers");
    const data = await response.json();
    const rows = (data.recommended || data.offers || []).filter((row) => row.recommended && String(row.gpu || "").indexOf("3090") >= 0 && row.inet_down >= 900 && row.disk_gb >= 150);
    chosenOffer = rows[0] || null;
  } catch (e) {
    chosenOffer = null;
  }
  line.textContent = chosenOffer
    ? (chosenOffer.gpu + " · " + chosenOffer.inet_down + " Mbps · " + chosenOffer.disk_gb + "GB")
    : "No matching computer.";
}

async function confirmRent() {
  if (!document.getElementById("rentWords").checked) {
    document.getElementById("reply-bubble").textContent = "Check I confirm RENT before Confirm Rent.";
    try { await fetch("/api/offers"); } catch (e) {}
    return;
  }
  if (!chosenOffer) {
    document.getElementById("reply-bubble").textContent = "No matching computer for this role.";
    return;
  }
  const response = await fetch("/api/rent", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      confirm: "RENT",
      dry_run: false,
      offer_id: chosenOffer.id,
      gpu: chosenOffer.gpu,
      inet_down: chosenOffer.inet_down,
      inet_up: chosenOffer.inet_up,
      disk_gb: chosenOffer.disk_gb || 150,
      region: chosenOffer.region || "",
      role: activeRole,
      ssh_host: document.getElementById("rentSsh").value.trim(),
      ssh_port: 22,
      ssh_user: "root"
    })
  });
  const data = await response.json();
  document.getElementById("reply-bubble").textContent = data.message || data.error || "Rent recorded.";
  document.getElementById("installWord").textContent = "Waiting";
}

async function refreshInstall() {
  const word = document.getElementById("installWord");
  try {
    const response = await fetch("/api/install/status");
    const data = await response.json();
    word.textContent = statusWord(data);
    if (word.textContent === "Ready" && data.where) {
      const reply = document.getElementById("reply-bubble");
      if (!reply.textContent || reply.textContent.indexOf("Ready on ") === 0 || reply.textContent.indexOf("Downloading ") === 0) {
        reply.textContent = "Ready on " + data.where + ".";
      }
      if (downloadPoll) { clearInterval(downloadPoll); downloadPoll = null; }
    }
    if (word.textContent !== "Downloading" && downloadPoll) {
      clearInterval(downloadPoll);
      downloadPoll = null;
    }
  } catch (e) {
    word.textContent = "Waiting";
  }
}

async function detectHardware() {
  const response = await fetch("/api/probe", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ compute: activeCompute(), role: activeRole })
  });
  const data = await response.json();
  if (data && data.model) model = data.model;
  const aider = data && data.aider && data.aider.method && data.aider.method !== "not-selected" ? (" Aider " + data.aider.method + ".") : "";
  const method = data && data.ollama && data.ollama.method ? (" Ollama " + data.ollama.method + ".") : "";
  document.getElementById("reply-bubble").textContent = (data.message || data.error || "Could not read this computer.") + aider + method;
}

async function downloadNow() {
  const response = await fetch("/api/download", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ compute: activeCompute(), role: activeRole })
  });
  const data = await response.json();
  if (data && data.model) model = data.model;
  document.getElementById("installWord").textContent = statusWord(data);
  document.getElementById("reply-bubble").textContent = data.message || data.error || "Download requested.";
  if (statusWord(data) === "Downloading") {
    if (downloadPoll) clearInterval(downloadPoll);
    downloadPoll = setInterval(refreshInstall, 2000);
  }
}

async function setCompute(compute) {
  const response = await fetch("/api/compute", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ compute: compute })
  });
  const data = await response.json();
  document.getElementById("computeCloud").setAttribute("aria-pressed", compute === "cloud" ? "true" : "false");
  document.getElementById("computeLocal").setAttribute("aria-pressed", compute === "local" ? "true" : "false");
  if (data && data.model) model = data.model;
  await loadModel();
}

document.getElementById("roleCoding").addEventListener("click", () => setRole("coding"));

async function authPost(body) {
  const response = await fetch("/api/auth", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  return response.json();
}

async function submitAuth(op) {
  const email = document.getElementById("authEmail").value.trim();
  const password = document.getElementById("authPassword").value;
  const data = await authPost({ op: op, email: email, password: password });
  if (!data.ok || !data.token) {
    document.getElementById("reply-bubble").textContent = data.error || "Sign in failed.";
    openThread();
    return;
  }
  authToken = data.token;
  sessionStorage.setItem("podcoderToken", authToken);
  document.getElementById("authPassword").value = "";
  showSignedIn(data.email);
  if (data.dev_token) {
    document.getElementById("authTokenBox").value = data.dev_token;
    document.getElementById("authTokenBox").hidden = false;
    document.getElementById("confirmEmail").hidden = false;
    document.getElementById("reply-bubble").textContent = "No mail server. Confirm token is in the dev inbox at auth/dev-inbox.json.";
  }
  await refreshChats();
}

async function confirmEmail() {
  const token = document.getElementById("authTokenBox").value.trim();
  const data = await authPost({ op: "confirm-email", confirm_token: token });
  document.getElementById("reply-bubble").textContent = data.ok ? "Email confirmed." : (data.error || "Confirm failed.");
}

async function resetPassword() {
  const email = document.getElementById("authEmail").value.trim();
  const data = await authPost({ op: "request-reset", email: email });
  if (!data.ok) {
    document.getElementById("reply-bubble").textContent = data.error || "Reset failed.";
    return;
  }
  if (data.dev_token) {
    document.getElementById("authTokenBox").value = data.dev_token;
    document.getElementById("authTokenBox").hidden = false;
    document.getElementById("setPassword").hidden = false;
    document.getElementById("reply-bubble").textContent = "No mail server. Reset token is in the dev inbox at auth/dev-inbox.json. Type a new password, then Set password.";
    return;
  }
  document.getElementById("reply-bubble").textContent = "If that email is registered, a reset note was sent.";
}

async function setPassword() {
  const data = await authPost({
    op: "reset-password",
    reset_token: document.getElementById("authTokenBox").value.trim(),
    password: document.getElementById("authPassword").value
  });
  document.getElementById("reply-bubble").textContent = data.ok ? "Password updated. Sign in with the new one." : (data.error || "Reset failed.");
  if (data.ok) {
    document.getElementById("authPassword").value = "";
    document.getElementById("authTokenBox").value = "";
    document.getElementById("setPassword").hidden = true;
  }
}

async function signOut() {
  if (authToken) await authPost({ op: "signout", token: authToken });
  showSignedOut();
  document.getElementById("reply-bubble").textContent = "";
}

async function sessionPost(body) {
  const response = await fetch("/api/sessions", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ token: authToken }, body))
  });
  return response.json();
}

function fillChatSelect(select, rows, skipId) {
  const previous = select.value;
  select.replaceChildren();
  rows.forEach((row) => {
    if (skipId && row.id === skipId) return;
    const option = document.createElement("option");
    option.value = row.id;
    option.textContent = row.title || "Chat";
    select.appendChild(option);
  });
  if ([...select.options].some((option) => option.value === previous)) select.value = previous;
}

function messageText(message) {
  if (message.role === "relay") return "From " + (message.from_title || "another chat") + ": " + message.text;
  if (message.role === "relay_out") return "Sent to " + (message.to_title || "another chat") + ": " + message.text;
  return message.text;
}

function chatMark(title) {
  const hay = String(title || "").toLowerCase();
  const pairs = [
    ["career", "💼"],
    ["health", "🩺"],
    ["calc", "🧮"],
    ["family", "👨‍👩‍👧"],
    ["money", "💰"],
    ["friend", "🤝"],
    ["evening", "🌙"],
    ["goal", "🎯"],
    ["learn", "📚"],
    ["partner", "❤️"],
    ["love", "❤️"]
  ];
  for (let i = 0; i < pairs.length; i++) {
    if (hay.indexOf(pairs[i][0]) >= 0) return pairs[i][1];
  }
  return "💬";
}

function setThreadTitle(title) {
  document.getElementById("threadTitle").textContent = title || "Chat";
}

function renderHistory(session) {
  if (session && session.title) setThreadTitle(session.title);
  const history = document.getElementById("historyBubbles");
  const reply = document.getElementById("reply-bubble");
  history.replaceChildren();
  const messages = session.messages || [];
  messages.forEach((message, index) => {
    const last = index === messages.length - 1;
    const mine = message.role === "user" || message.role === "relay_out";
    if (last && !mine) {
      reply.textContent = messageText(message);
      return;
    }
    const bubble = document.createElement("div");
    bubble.className = mine ? "bubble mine" : "bubble theirs";
    bubble.textContent = messageText(message);
    history.appendChild(bubble);
  });
  const tail = messages[messages.length - 1];
  if (!tail || tail.role === "user" || tail.role === "relay_out") reply.textContent = "";
}

function showDemoList() {
  // The sample chats stay in the list, but a fresh visit opens an empty thread, not a canned demo conversation.
  document.body.classList.remove("thread-open");
  activeSessionId = null;
  paintChatList(DEMO_CHATS, true);
  setThreadTitle("New chat");
  document.getElementById("historyBubbles").replaceChildren();
  document.getElementById("reply-bubble").textContent = "";
}

function showMyMessage(text) {
  // Show what was just typed as its own bubble right away; the saved chat re-renders the same way.
  const history = document.getElementById("historyBubbles");
  const reply = document.getElementById("reply-bubble");
  if (reply.textContent.trim() && reply.textContent !== "Working on it…") {
    const prev = document.createElement("div");
    prev.className = "bubble theirs";
    prev.textContent = reply.textContent;
    history.appendChild(prev);
  }
  const bubble = document.createElement("div");
  bubble.className = "bubble mine";
  bubble.textContent = text;
  history.appendChild(bubble);
  reply.textContent = "";
}

function paintChatList(rows, demo) {
  const list = document.getElementById("sessionList");
  list.replaceChildren();
  rows.forEach((row) => {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.id = row.id;
    const mark = document.createElement("span");
    mark.className = "chatEmoji";
    mark.setAttribute("aria-hidden", "true");
    mark.textContent = chatMark(row.title);
    const label = document.createElement("span");
    label.textContent = row.title || "Chat";
    button.append(mark, label);
    button.setAttribute("aria-pressed", row.id === activeSessionId ? "true" : "false");
    button.addEventListener("click", () => {
      if (demo) {
        activeSessionId = row.id;
        document.querySelectorAll("#sessionList button").forEach((item) => {
          item.setAttribute("aria-pressed", item.dataset.id === row.id ? "true" : "false");
        });
        renderHistory(row);
        openThread();
        return;
      }
      showSession(row.id, true);
    });
    list.appendChild(button);
  });
}

async function showSession(sessionId, open) {
  const data = await sessionPost({ op: "get", session_id: sessionId });
  if (!data.ok || !data.session) return;
  activeSessionId = data.session.id;
  document.querySelectorAll("#sessionList button").forEach((button) => {
    button.setAttribute("aria-pressed", button.dataset.id === activeSessionId ? "true" : "false");
  });
  renderHistory(data.session);
  fillChatSelect(document.getElementById("relayTarget"), chatRows, activeSessionId);
  if (open) openThread();
}

async function refreshChats(preferId) {
  const data = await sessionPost({ op: "list" });
  chatRows = (data && data.sessions) || [];
  if (!chatRows.length) {
    const created = await sessionPost({ op: "create", title: "Chat 1" });
    if (created.session) chatRows = [created.session];
  }
  paintChatList(chatRows);
  const current = activeSessionId && String(activeSessionId).indexOf("demo-") !== 0 ? activeSessionId : null;
  const wanted = preferId || current || (chatRows[0] && chatRows[0].id);
  if (wanted) await showSession(wanted);
}

async function newChat() {
  if (!authToken) {
    document.getElementById("drawer").hidden = false;
    document.getElementById("toolsToggle").setAttribute("aria-expanded", "true");
    document.getElementById("reply-bubble").textContent = "Sign in to open a chat.";
    openThread();
    return;
  }
  const created = await sessionPost({ op: "create", title: "Chat " + (chatRows.length + 1) });
  if (!created.ok) {
    document.getElementById("reply-bubble").textContent = created.error || "Could not open a chat.";
    return;
  }
  await refreshChats(created.session.id);
  openThread();
}

async function rememberTurn(userText, assistantText) {
  if (!authToken) return;
  if (!activeSessionId || String(activeSessionId).indexOf("demo-") === 0) await refreshChats();
  await sessionPost({ op: "append", session_id: activeSessionId, role: "user", text: userText });
  await sessionPost({ op: "append", session_id: activeSessionId, role: "assistant", text: assistantText });
  await showSession(activeSessionId);
}

async function rememberReply(assistantText) {
  // A finished coding job adds only Simko SI's answer; the typed words were saved when they were sent.
  if (!authToken) return;
  if (!activeSessionId || String(activeSessionId).indexOf("demo-") === 0) await refreshChats();
  await sessionPost({ op: "append", session_id: activeSessionId, role: "assistant", text: assistantText });
  await showSession(activeSessionId);
}

async function sendToOtherChat() {
  const text = document.getElementById("everyday").value.trim();
  const target = document.getElementById("relayTarget").value;
  if (!text) {
    document.getElementById("reply-bubble").textContent = "Type a message, then Send to chat.";
    return;
  }
  if (!target) {
    document.getElementById("reply-bubble").textContent = "Open another chat first.";
    return;
  }
  const data = await sessionPost({
    op: "relay",
    from_session_id: activeSessionId,
    to_session_id: target,
    text: text
  });
  document.getElementById("relay-sheet").hidden = true;
  if (!data.ok) {
    document.getElementById("reply-bubble").textContent = data.error || "Could not send to that chat.";
    return;
  }
  document.getElementById("everyday").value = "";
  await showSession(activeSessionId);
}

async function searchChats() {
  const q = document.getElementById("chatSearch").value.trim();
  try {
    const data = await sessionPost({ op: "search", q: q });
    if (!authToken) {
      const rows = DEMO_CHATS.filter((row) => {
        if (!q) return true;
        const blob = (row.title + " " + (row.messages || []).map((message) => message.text).join(" ")).toLowerCase();
        return blob.indexOf(q.toLowerCase()) >= 0;
      });
      paintChatList(rows, true);
      return;
    }
    chatRows = (data && data.sessions) || [];
    paintChatList(chatRows);
  } catch (e) {
    document.getElementById("reply-bubble").textContent = "Search could not reach the app.";
  }
}

  if (!authToken) {
    showSignedOut();
    return;
  }
  const data = await authPost({ op: "me", token: authToken });
  if (!data.ok) {
    showSignedOut();
    return;
  }
  showSignedIn(data.email);
  await refreshChats();
}
async function paintLife(data) {
  const box = document.getElementById("lifeTags");
  const last = document.getElementById("lifeLast");
  const rows = (data && data.categories) || [];
  const tags = (data && data.tags) || [];
  const current = tags.length ? tags[tags.length - 1].category : "";
  box.replaceChildren();
  rows.forEach((row) => {
    const button = document.createElement("button");
    button.type = "button";
    const words = (data && data.statuses) || {};
    button.textContent = row.label + " · " + (words[row.id] || "not discussed");
    button.setAttribute("aria-pressed", row.id === current ? "true" : "false");
    button.addEventListener("click", () => retag(row.id));
    box.appendChild(button);
  });
  const tagged = tags.length ? "Tagged as " + tags[tags.length - 1].label + "." : "Words only. No grade.";
  last.textContent = data && data.dominance_note ? data.dominance_note + " " + tagged : tagged;
}

function applyFold() {
  let segmented = false;
  try {
    segmented = window.matchMedia("(horizontal-viewport-segments: 2), (vertical-viewport-segments: 2)").matches;
  } catch (err) {
    segmented = false;
  }
  const cover = window.matchMedia("(max-width: 640px), (max-height: 560px)").matches;
  document.body.classList.toggle("narrow", !segmented && cover);
}

function bindFold() {
  applyFold();
  ["(max-width: 640px), (max-height: 560px)", "(horizontal-viewport-segments: 2), (vertical-viewport-segments: 2)"].forEach((query) => {
    try {
      window.matchMedia(query).addEventListener("change", applyFold);
    } catch (err) {}
  });
}

function paintFromProbe(data) {
  const probe = data.probe || {};
  paintTurtle({
    ok: data.ok,
    message: data.message || data.error || "",
    probe: probe,
    decision: {
      tag: data.tag || data.model || "",
      ollama: data.ollama || {},
      aider: data.aider || {},
      message: data.message || ""
    },
    profile: data.translation_profile || data.profile || "",
    chat_unlocked: !!(data.chat_unlocked || (document.getElementById("turtleEnter") && !document.getElementById("turtleEnter").hidden))
  });
}

async function redetectComputer() {
  clearTurtleError();
  setTurtleBusy(true);
  try {
    const response = await fetch("/api/probe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ compute: "local", role: "coding" })
    });
    const data = await response.json();
    if (!response.ok || data.ok === false) {
      showTurtleError(data.error || data.message || "This computer could not be read.");
      return;
    }
    paintFromProbe(data);
  } catch (err) {
    showTurtleError("Re-detect could not reach the computer.");
  } finally {
    setTurtleBusy(false);
  }
}

async function runSetupCheck() {
  clearTurtleError();
  setTurtleBusy(true);
  const stage = document.getElementById("turtleStage");
  stage.textContent = "Downloading";
  try {
    const response = await fetch("/api/setup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ op: "check", role: "coding" })
    });
    const data = await response.json();
    const statusResponse = await fetch("/api/install/status");
    const install = await statusResponse.json();
    let word = statusWord(install);
    if (data.chat_unlocked && word === "Waiting") word = "Ready";
    if (data.phase === "blocked") word = "Waiting";
    stage.textContent = word;
    if (data.ok === false) {
      showTurtleError(data.error || data.message || "The setup check did not finish.");
      return;
    }
    paintTurtle(data);
    stage.textContent = word;
  } catch (err) {
    stage.textContent = "Waiting";
    showTurtleError("The setup check could not reach the computer.");
  } finally {
    setTurtleBusy(false);
  }
}

async function askTurtle(event) {
  if (event) event.preventDefault();
  const text = document.getElementById("turtleQuestion").value.trim();
  const reply = document.getElementById("turtleReply");
  clearTurtleError();
  if (!text) {
    showTurtleError("Type a question, then Send.");
    return;
  }
  setTurtleBusy(true);
  reply.textContent = "";
  try {
    const response = await fetch("/api/simco/turn", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text })
    });
    const data = await response.json();
    if (data && data.everyday) reply.textContent = data.everyday;
    if (!reply.textContent) {
      showTurtleError((data && (data.error || data.message)) || "The computer did not answer.");
    }
  } catch (err) {
    showTurtleError("Ask the turtle could not reach the computer.");
  } finally {
    setTurtleBusy(false);
  }
}

function paintTurtle(data) {
  const log = document.getElementById("turtleLog");
  const lead = document.getElementById("turtleLead");
  if (!data) {
    log.textContent = "Simko SI could not read this computer.";
    return;
  }
  const probe = data.probe || {};
  const decision = data.decision || {};
  const ollama = decision.ollama || data.ollama || {};
  const aiderChoice = decision.aider || data.aider || {};
  const lines = [
    data.message || "",
    probe.cpu ? ("CPU " + probe.cpu) : "",
    probe.ram_gb ? ("Memory " + probe.ram_gb + " GB") : "",
    probe.gpu ? ("GPU " + probe.gpu) : "",
    decision.tag ? ("Granite " + decision.tag) : "",
    ollama.method ? ("Ollama " + ollama.method + (ollama.version ? " " + ollama.version : "")) : "",
    aiderChoice.method && aiderChoice.method !== "not-selected" ? ("Aider " + aiderChoice.method + (aiderChoice.version ? " " + aiderChoice.version : "")) : "",
    data.ready_check && data.ready_check.ok ? "Ready check planned." : "",
    (data.profile_id || data.profile) ? ("Profile " + (data.profile_id || data.profile)) : ""
  ].filter(Boolean);
  log.textContent = lines.join("\n");
  if (data.chat_unlocked) {
    lead.textContent = "The reef is quiet. This computer is configured.";
    document.getElementById("turtleEnter").hidden = false;
  } else {
    lead.textContent = "This computer is not ready for a local Granite yet.";
  }
}

function showHostEditor() {
  const row = document.getElementById("hostRow");
  const box = document.getElementById("hostUrl");
  row.hidden = false;
  if (window.simcoHost && window.simcoHost.current()) box.value = window.simcoHost.current();
  showTurtle();
}

async function bootSetup() {
  const force = location.pathname === "/turtle" || location.pathname === "/turtle.html";
  showTurtle();
  let data = {};
  try {
    const response = await fetch("/api/setup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ op: "run", role: "coding" })
    });
    data = await response.json();
  } catch (e) {
    data = { message: "Setup could not reach the computer. Check the address in Computer." };
  }
  paintTurtle(data);
  if (!force && data.chat_unlocked && sessionStorage.getItem("simcoTurtleSeen") === "1") hideTurtle(false);
}

let clientStarted = false;
function startClient() {
  if (clientStarted) {
    bootSetup();
    return;
  }
  clientStarted = true;
  loadModel();
  autoConnect();
  refreshInstall();
  bootAuth();
  loadLife();
  bootSetup();
}

async function connectHost() {
  const hint = document.getElementById("hostHint");
  const host = window.simcoHost;
  if (!host) {
    hint.textContent = "The host helper did not load.";
    return;
  }
  const saved = host.save(document.getElementById("hostUrl").value);
  if (!saved.ok) {
    hint.textContent = saved.error;
    return;
  }
  hint.textContent = "Reaching the computer.";
  try {
    const response = await fetch("/api/health");
    const data = await response.json();
    if (!data || data.ok !== true) throw new Error("refused");
  } catch (err) {
    hint.textContent = "Could not reach that computer. Start Simko SI there, then try the address again.";
    return;
  }
  hint.textContent = "Connected. The computer is configuring itself.";
  startClient();
}

function armTurtleMotion() {
  function markHidden() {
    document.documentElement.classList.toggle("simco-turtle-paused", document.hidden);
  }
  document.addEventListener("visibilitychange", markHidden);
  let idleTimer = 0;
  function bump() {
    document.documentElement.classList.remove("simco-turtle-idle");
    window.clearTimeout(idleTimer);
    idleTimer = window.setTimeout(() => document.documentElement.classList.add("simco-turtle-idle"), 20000);
  }
  ["pointermove", "keydown", "touchstart"].forEach((name) => {
    window.addEventListener(name, bump, { passive: true });
  });
  markHidden();
  bump();
}

document.getElementById("turtleEnter").addEventListener("click", () => hideTurtle(true));
document.getElementById("turtlePeek").addEventListener("click", () => hideTurtle(false));
document.getElementById("openTurtle").addEventListener("click", () => showTurtle());
document.getElementById("openHost").addEventListener("click", () => showHostEditor());
document.getElementById("hostSave").addEventListener("click", () => connectHost());
document.getElementById("turtleRedetect").addEventListener("click", () => redetectComputer());
document.getElementById("turtleCheck").addEventListener("click", () => runSetupCheck());
document.getElementById("turtleAsk").addEventListener("submit", askTurtle);

bindFold();
showDemoList();
armTurtleMotion();
if (window.simcoHost && window.simcoHost.needsHost()) {
  showHostEditor();
  document.getElementById("turtleLead").textContent = "This phone is the window. The computer does the work.";
  document.getElementById("turtleLog").textContent = "Enter the address of the computer running Simko SI. Granite, Ollama, and Aider download there.";
} else {
  if (window.simcoHost && window.simcoHost.native()) showHostEditor();
  startClient();
}
</script>
