<body><main>
<header><a href="/"><img src="/assets/icons/icon-192.png" alt=""/>Simko SI</a></header>
<h1>Status</h1>
<p class="muted">Checked from your browser just now. The server also checks itself every 10 minutes and emails the owner if it stops answering.</p>
<ul id="checks">
<li id="c-site">Website: <span>checking…</span></li>
<li id="c-api">API and database: <span>checking…</span></li>
<li id="c-build">Current version: <span>checking…</span></li>
</ul>
<p class="muted" id="checkedAt"></p>
<script>
(function(){
  function set(id, ok, text){ var s=document.querySelector('#'+id+' span'); s.textContent=(ok?'✅ ':'⚠️ ')+text; }
  var t0=Date.now();
  fetch('/api/health',{cache:'no-store'}).then(function(r){ return r.json().then(function(j){ return [r,j]; }); }).then(function(x){
    var ok=x[0].ok && x[1] && x[1].ok!==false; set('c-api', ok, ok ? 'Working ('+(Date.now()-t0)+' ms)' : 'Having trouble');
  }).catch(function(){ set('c-api', false, 'Not answering'); });
  fetch('/',{cache:'no-store'}).then(function(r){ return r.text().then(function(t){ return [r,t]; }); }).then(function(x){
    set('c-site', x[0].ok, x[0].ok ? 'Working' : 'Error '+x[0].status);
    var m=x[1].match(/name="simko-build" content="([^"]+)"/); set('c-build', !!m, m ? m[1] : 'unknown');
  }).catch(function(){ set('c-site', false, 'Not answering'); set('c-build', false, 'unknown'); });
  document.getElementById('checkedAt').textContent='Checked '+new Date().toLocaleString();
})();
</script>
